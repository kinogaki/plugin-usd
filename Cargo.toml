[package]
name = "kinogaki-usd"
description = "Universal Scene Description as a format plugin for Kinogaki Studio: usda, usdc and usdz layers read and written, stages composed, and the scene (meshes, curves, points, instances, cameras, lights and UsdShade materials) read and authored"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "(MIT OR Apache-2.0) AND LicenseRef-TOST-1.0"

# The format builds from its own repository and the public SDK's alone,
# checked out side by side as Studio's tree lays them out (README
# "Building"): its manifest names everything it needs instead of inheriting
# it from the tree.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
# The process's workers: large arrays parse, format, compress and decode on
# them, within the host's one budget.
kinogaki-studio-api = { path = "../../sdk/crates/api" }
# MaterialX node definitions and the standard light and camera.
kinogaki-render-api = { path = "../../sdk/crates/render-api" }
# MaterialX's library (definitions and translation graphs) and documents,
# which a layer may reference.
kinogaki-mtlx = { path = "../../sdk/crates/mtlx" }

[dev-dependencies]
# The SDK's color service that converts nothing.
kinogaki-studio-api-testing = { path = "../../sdk/crates/api-testing" }
